name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build KeyboardShare/KeyboardShare.csproj -c Release --warnaserror
      - name: Run console checks
        run: dotnet run --project KeyboardShare.Tests/KeyboardShare.Tests.csproj -c Release
      - name: Verify self-contained packaging
        shell: pwsh
        run: ./scripts/Publish.ps1
